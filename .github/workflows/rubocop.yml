---
name: Rubocop

on:
  workflow_call:
    inputs:
      ruby:
        description: Ruby version to use
        default: '2.7'
        required: false
        type: string
      working-directory:
        description: The working directory where all jobs should be executed
        default: '.'
        required: false
        type: string
      command:
        description: The command used to run Rubocop
        default: |
          if [ -f Rakefile ] ; then
            bundle exec rake rubocop
          else
            bundle exec rubocop --parallel
          fi
        required: false
        type: string
      additional_packages:
        description: String of additional packages that should be installed
        default: ''
        required: false
        type: string

jobs:
  rubocop:
    name: Rubocop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: install additional packages
        if: ${{ inputs.additional_packages != '' }}
        run: sudo apt-get install -y ${{ inputs.additional_packages }}
      - name: Setup ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ inputs.ruby }}
          bundler-cache: true
          working-directory: ${{ inputs.working-directory }}
      - name: Archive Gemfile.lock
        uses: actions/upload-artifact@v5
        with:
          name: Gemfile-theforeman-actions-rubocop-ruby-${{ inputs.ruby }}.lock
          path: Gemfile.lock
      - name: Rubocop
        run: ${{ inputs.command }}
